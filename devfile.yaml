schemaVersion: 2.2.2
metadata:
  name: ai-code-template
  displayName: AI-Powered Python Workspace
  description: >
    Python development environment with Cline, OpenCode, and Task Manager
    pre-configured for your LLM endpoint.
  tags:
    - Python
    - AI
    - Cline
    - OpenCode
  language: Python

# ─────────────────────────────────────────────────────────────────────────────
# EXTENSIONS
#
# Listed via che-code.eclipse.org/vscode-extensions on the dev component.
# The DevWorkspace operator installs them before VS Code starts, so no
# registry redirect or autoApplyRecommendations timing issues.
# Also declared in .vscode/extensions.json for local clone convenience.
# ─────────────────────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────────────────────
# LLM CONFIGURATION
#
# LLM_API_BASE_URL and LLM_API_KEY are injected via a DevSpaces user secret.
# Create the secret in your <username>-devspaces namespace — see README.md.
# The postStart script rewrites .vscode/settings.json from env vars so
# Cline picks up the correct endpoint on every workspace start.
# ─────────────────────────────────────────────────────────────────────────────

components:
  - name: dev
    container:
      image: registry.redhat.io/devspaces/udi-rhel8:latest
      memoryLimit: 4Gi
      memoryRequest: 1Gi
      cpuLimit: "2"
      cpuRequest: 500m
      mountSources: true
      endpoints:
        - name: flask
          targetPort: 8080
          exposure: public
          protocol: https
    attributes:
      che-code.eclipse.org/vscode-extensions:
        - saoudrizwan.claude-dev
        - cnshenj.vscode-task-manager
        - sst-dev.opencode

  - name: opencode
    container:
      image: ghcr.io/anomalyco/opencode:latest
      memoryLimit: 1Gi
      memoryRequest: 256Mi
      cpuLimit: "1"
      cpuRequest: 250m
      mountSources: true
      command: ["tail", "-f", "/dev/null"]
      env:
        - name: HOME
          value: "/tmp/opencode-home"

commands:
  - id: setup-workspace
    exec:
      label: "Setup: configure LLM endpoint from env vars"
      component: dev
      commandLine: |
        set -e
        echo "Writing .vscode/settings.json from env vars..."
        mkdir -p ${PROJECT_SOURCE}/.vscode
        python3 -c "import json,os; s={'extensions.autoApplyRecommendations':True,'cline.apiProvider':'openai-compatible','cline.openAiBaseUrl':os.environ.get('LLM_API_BASE_URL','https://api.openai.com/v1'),'cline.openAiModelId':'gpt-oss-120b'}; open('${PROJECT_SOURCE}/.vscode/settings.json','w').write(json.dumps(s,indent=2))"
        echo "Done."

  - id: run-app
    exec:
      label: "Run Flask App"
      component: dev
      commandLine: "pip install -r requirements.txt && python app.py"
      workingDir: ${PROJECT_SOURCE}
      group:
        kind: run
        isDefault: true

  - id: opencode-run
    exec:
      label: "Launch OpenCode (terminal AI)"
      component: opencode
      commandLine: "cd ${PROJECT_SOURCE} && opencode"
      workingDir: ${PROJECT_SOURCE}

events:
  postStart:
    - setup-workspace
