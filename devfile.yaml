schemaVersion: 2.2.2
metadata:
  name: ai-code-template
  displayName: AI-Powered Python Workspace
  description: >
    Python development environment with Cline (VS Code AI agent) and
    OpenCode (terminal AI agent) pre-configured for your LLM endpoint.
  tags:
    - Python
    - AI
    - Cline
    - OpenCode
  language: Python

# ─────────────────────────────────────────────────────────────────────────────
# EXTENSION INSTALLATION NOTE (DevSpaces 3.29 / VS Code-based editor)
#
# The old Che-Theia attribute "che-code.eclipse.org/vscode-extensions" is NOT
# supported by the VS Code (che-code) editor.  The correct approach per RH docs
# (section 14.3) is to set DEFAULT_EXTENSIONS to a path of .vsix binaries and
# use a postStart event to fetch them before the IDE picks them up.
# ─────────────────────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────────────────────
# LLM CONFIGURATION
#
# LLM_API_BASE_URL and LLM_API_KEY are injected via a DevSpaces user secret.
# Create the secret in your <username>-devspaces namespace — see README.md.
# The postStart script writes .vscode/settings.json from these env vars so
# both Cline and OpenCode pick up the correct endpoint automatically.
# ─────────────────────────────────────────────────────────────────────────────

components:
  - name: dev
    container:
      image: registry.redhat.io/devspaces/udi-rhel8:latest
      memoryLimit: 4Gi
      memoryRequest: 1Gi
      cpuLimit: "2"
      cpuRequest: 500m
      mountSources: true
      endpoints:
        - name: flask
          targetPort: 8080
          exposure: public
          protocol: https
      env:
        # Tells che-code to install the vsix after it is downloaded by postStart
        - name: DEFAULT_EXTENSIONS
          value: "/tmp/cline.vsix"

  - name: opencode
    container:
      image: ghcr.io/anomalyco/opencode:latest
      memoryLimit: 1Gi
      memoryRequest: 256Mi
      cpuLimit: "1"
      cpuRequest: 250m
      mountSources: true
      command: ["tail", "-f", "/dev/null"]
      env:
        - name: HOME
          value: "/tmp/opencode-home"

commands:
  - id: setup-workspace
    exec:
      label: "Setup: download Cline and configure LLM endpoint"
      component: dev
      commandLine: >-
        set -e &&
        echo "Downloading Cline vsix..." &&
        curl -fsSL
        'https://open-vsx.org/api/saoudrizwan/claude-dev/4.1.16/file/saoudrizwan.claude-dev-4.1.16.vsix'
        -o /tmp/cline.vsix &&
        echo "Writing .vscode/settings.json from env vars..." &&
        mkdir -p ${PROJECT_SOURCE}/.vscode &&
        python3 -c "
        import json, os
        s = {
          'cline.apiProvider': 'openai-compatible',
          'cline.openAiBaseUrl': os.environ.get('LLM_API_BASE_URL', 'https://api.openai.com/v1'),
          'cline.openAiModelId': 'gpt-oss-120b'
        }
        open('${PROJECT_SOURCE}/.vscode/settings.json', 'w').write(json.dumps(s, indent=2))
        " &&
        echo "Done."

  - id: run-app
    exec:
      label: "Run Flask App"
      component: dev
      commandLine: "pip install -r requirements.txt && python app.py"
      workingDir: ${PROJECT_SOURCE}
      group:
        kind: run
        isDefault: true

  - id: opencode-run
    exec:
      label: "Launch OpenCode (terminal AI)"
      component: opencode
      commandLine: "cd ${PROJECT_SOURCE} && opencode"
      workingDir: ${PROJECT_SOURCE}

events:
  postStart:
    - setup-workspace
