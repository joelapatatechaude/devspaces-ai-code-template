schemaVersion: 2.2.2
metadata:
  name: ai-code-template
  displayName: AI-Powered Python Workspace
  description: >
    Python development environment with Cline (VS Code AI agent) and
    OpenCode (terminal AI agent) pre-configured for your LLM endpoint.
  tags:
    - Python
    - AI
    - Cline
    - OpenCode
  language: Python

# ─────────────────────────────────────────────────────────────────────────────
# EXTENSION INSTALLATION NOTE (DevSpaces 3.29 / VS Code-based editor)
#
# The old Che-Theia attribute "che-code.eclipse.org/vscode-extensions" is NOT
# supported by the VS Code (che-code) editor.  The correct approach per RH docs
# (section 14.3) is to set DEFAULT_EXTENSIONS to a path of .vsix binaries and
# use a postStart event to fetch them before the IDE picks them up.
# ─────────────────────────────────────────────────────────────────────────────

components:
  - name: dev
    container:
      image: registry.redhat.io/devspaces/udi-rhel8:latest
      memoryLimit: 4Gi
      memoryRequest: 1Gi
      cpuLimit: "2"
      cpuRequest: 500m
      mountSources: true
      endpoints:
        - name: flask
          targetPort: 8080
          exposure: public
          protocol: https
      env:
        # LLM endpoint – override in your fork or via a DevSpaces user secret
        - name: LLM_API_BASE_URL
          value: "https://api.openai.com/v1"
        - name: LLM_MODEL_ID
          value: "gpt-4o"
        # Tells che-code to install the vsix after it is downloaded by postStart
        - name: DEFAULT_EXTENSIONS
          value: "/tmp/cline.vsix"

  - name: opencode
    container:
      image: ghcr.io/anomalyco/opencode:latest
      memoryLimit: 1Gi
      memoryRequest: 256Mi
      cpuLimit: "1"
      cpuRequest: 250m
      mountSources: true
      # Keep the sidecar alive so users can exec into it from the terminal panel
      command: ["tail", "-f", "/dev/null"]
      env:
        - name: HOME
          value: "/tmp/opencode-home"
        - name: LLM_API_BASE_URL
          value: "https://api.openai.com/v1"
        - name: LLM_MODEL_ID
          value: "gpt-4o"

commands:
  # Downloads Cline vsix from Open VSX before the IDE starts picking it up.
  # Pinned to a known-good version; bump the URL to update.
  - id: download-cline
    exec:
      label: "Download Cline extension"
      component: dev
      commandLine: >-
        curl -fsSL
        'https://open-vsx.org/api/saoudrizwan/claude-dev/4.1.16/file/saoudrizwan.claude-dev-4.1.16.vsix'
        -o /tmp/cline.vsix
        && echo "Cline vsix downloaded to /tmp/cline.vsix"

  - id: run-app
    exec:
      label: "Run Flask App"
      component: dev
      commandLine: "pip install -r requirements.txt && python app.py"
      workingDir: ${PROJECT_SOURCE}
      group:
        kind: run
        isDefault: true

  - id: opencode-run
    exec:
      label: "Launch OpenCode (terminal AI)"
      component: opencode
      commandLine: "cd ${PROJECT_SOURCE} && opencode"
      workingDir: ${PROJECT_SOURCE}

events:
  postStart:
    - download-cline
